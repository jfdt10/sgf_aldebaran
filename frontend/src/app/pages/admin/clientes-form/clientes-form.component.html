<div class="page-container">
  <div class="page-header">
    <button class="btn-back" (click)="cancelar()">
      <lucide-icon [img]="icons.back"></lucide-icon> {{ "Voltar" | tr }}
    </button>
    <div>
      <h1>{{ modoEdicao ? ("Editar Cliente" | tr) : ("Novo Cliente" | tr) }}</h1>
      <p>{{ modoEdicao ? ("Atualize os dados cadastrais." | tr) : ("Preencha as informações abaixo." | tr) }}</p>
    </div>
  </div>

  <div class="card form-container">
    <form (ngSubmit)="salvar()">
      
      <div class="form-grid">
        <div class="input-group span-2">
          <label>{{ "Nome Completo / Razão Social *" | tr }}</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.user" class="field-icon"></lucide-icon>
            <input [(ngModel)]="form.nome" name="nome" [placeholder]='"Ex: Empresa LTDA ou João Silva" | tr' required>
          </div>
        </div>

        <div class="input-group">
          <label>CPF / CNPJ *</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.file" class="field-icon"></lucide-icon>
            <input 
              [(ngModel)]="form.documento" 
              (input)="mascaraDocumento($event)"
              name="documento" 
              placeholder="000.000.000-00" 
              [disabled]="modoEdicao" 
              [title]='"O documento não pode ser alterado após cadastro." | tr'
              required>
          </div>
          <small *ngIf="modoEdicao" class="hint">{{ "Documento fixo." | tr }}</small>
        </div>

        <div class="input-group">
          <label>{{ "E-mail *" | tr }}</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.mail" class="field-icon"></lucide-icon>
            <input [(ngModel)]="form.email" name="email" type="email" placeholder="contato@email.com" required>
          </div>
        </div>

        <div class="input-group">
          <label>{{ "Telefone / Celular" | tr }}</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.phone" class="field-icon"></lucide-icon>
            <input [(ngModel)]="form.telefone" (input)="mascaraTelefone($event)" name="telefone" placeholder="(00) 00000-0000">
          </div>
        </div>

        <div class="input-group span-2">
          <label>{{ "Endereço" | tr }}</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.map" class="field-icon"></lucide-icon>
            <input [(ngModel)]="form.endereco" name="endereco" [placeholder]='"Rua, Número, Bairro..." | tr'>
          </div>
        </div>

        <div class="input-group">
          <label>Status</label>
          <select [(ngModel)]="form.ativo" name="ativo">
            <option [ngValue]="true">{{ "Ativo" | tr }}</option>
            <option [ngValue]="false">{{ "Inativo" | tr }}</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancelar()">
          {{ "Cancelar" | tr }}
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          <lucide-icon [img]="icons.save"></lucide-icon>
          {{ loading ? ("Salvando..." | tr) : ("Salvar Dados" | tr) }}
        </button>
      </div>

    </form>
  </div>
</div>
