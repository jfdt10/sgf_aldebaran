<div class="split-layout">
  <section class="hero-section">
    <div class="hero-content">
      <div class="logo-box">
        <img src="assets/logo-aldebaran.png" alt="Aldebaran" class="hero-logo-white">
      </div>
      <h1>{{ "Bem-vindo ao" | tr }}<br>{{ "Sistema Fila" | tr }}</h1>
      <p>{{ "Gestão Inteligente de Atendimento" | tr }}</p>
      <div class="stats-row">
        <div class="stat"><strong>24/7</strong><span>Online</span></div>
        <div class="sep"></div>
        <div class="stat"><strong>100%</strong><span>Digital</span></div>
      </div>
    </div>
  </section>

  <section class="form-section">
    <div class="form-container">
      
      <div class="lang-switch-container">
        <div class="lang-switch-totem">
          <button type="button" [class.active]="language.current() === 'PT'" [attr.aria-pressed]="language.current() === 'PT'" (click)="language.select('PT')">PT</button>
                  <button type="button" [class.active]="language.current() === 'EN'" [attr.aria-pressed]="language.current() === 'EN'" (click)="language.select('EN')">EN</button>
        </div>
      </div>

      <div class="header-text">
        <h2>{{ "Fazer Login" | tr }}</h2>
        <p>{{ "Selecione a Filial:" | tr }} <span>Matriz Centro</span></p>
      </div>

      <form (submit)="fazerLogin()">
        <div class="input-group">
          <label>{{ "E-MAIL" | tr }}</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.mail" size="20"></lucide-icon>
            <input type="email" [(ngModel)]="email" name="email" [placeholder]='"seu@email.com" | tr' required>
          </div>
        </div>

        <div class="input-group">
          <label>{{ "SENHA" | tr }}</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.lock" size="20"></lucide-icon>
            <input type="password" [(ngModel)]="senha" name="senha" [placeholder]='"Sua senha" | tr' required>
          </div>
        </div>

        <div class="options">
          <label class="checkbox-item"><input type="checkbox"> {{ "Lembrar-me" | tr }}</label>
          <a routerLink="/recover">{{ "Esqueci a senha" | tr }}</a>
        </div>

        <button class="btn-primary" [disabled]="carregando">
          <span *ngIf="!carregando">{{ "Entrar" | tr }}</span>
          <span *ngIf="carregando" class="loader"></span>
        </button>
      </form>

      <div class="footer-msg">
        {{ "Ainda não é cliente?" | tr }} <a routerLink="/signup">{{ "Crie sua conta" | tr }}</a>
      </div>
    </div>
  </section>
</div>
