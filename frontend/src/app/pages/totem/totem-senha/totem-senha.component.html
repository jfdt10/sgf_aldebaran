<div class="totem-container" *ngIf="ticket">
  
  <div class="ticket-card">
    <app-language-switch class="page-language receipt-language" />
    
    <img src="assets/logo-aldebaran.png" alt="Aldebaran" class="brand-logo">
    
    <div class="success-msg">{{ "Senha retirada com sucesso!" | tr }}</div>

    <div class="senha-big">{{ ticket.numeroDisplay }}</div>

    <div class="info-box">
      <div class="info-row">
        <span>{{ "Categoria:" | tr }}</span>
        <strong>{{ ticket.categoria }}</strong>
      </div>
      <div class="info-row">
        <span>{{ "Tipo:" | tr }}</span>
        <strong>{{ ticket.tipo | tr }}</strong>
      </div>
      <div class="info-row">
        <span>{{ "Data:" | tr }}</span>
        <strong>{{ ticket.dataHora | date:'dd/MM HH:mm' }}</strong>
      </div>
    </div>

    <div class="qr-section">
      <p>{{ "Escaneie para acompanhar:" | tr }}</p>
      <img [src]="qrCodeUrl" class="qr-img" alt="QR Code">
    </div>

  </div>

  <div class="status-print">{{ "Imprimindo ticket..." | tr }}</div>

</div>
